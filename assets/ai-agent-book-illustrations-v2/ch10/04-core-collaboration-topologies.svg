<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="white"/>
  <style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#111} .t{font-size:38px;font-weight:700}.s{font-size:25px}.l{stroke:#111;stroke-width:8;fill:none;stroke-linecap:round;stroke-linejoin:round}.b{fill:#111}.blue{stroke:#1677ff;fill:none;stroke-width:10;stroke-linecap:round}.orange{stroke:#f06a20;fill:none;stroke-width:10;stroke-linecap:round}.card{fill:#fff;stroke:#111;stroke-width:6;rx:28}</style>
