<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><rect width="1600" height="900" fill="white"/><style>text{font-family:"PingFang SC","Microsoft YaHei",sans-serif;fill:#111}.t{font-size:42px;font-weight:700}.s{font-size:28px}.l{stroke:#111;stroke-width:8;fill:none;stroke-linecap:round}.b{fill:#111}.blue{fill:#eaf3ff;stroke:#1677ff;stroke-width:8}.orange{fill:#fff0e6;stroke:#f06a20;stroke-width:8}</style><text x="800" y="80" text-anchor="middle" class="t">角色差异：知识流程用 Skill；权限或工具隔离才转交独立 Agent</text><line x1="800" y1="130" x2="800" y2="820" stroke="#ddd" stroke-width="4"/><text x="400" y="170" text-anchor="middle" class="t">Skill：同一个 Agent 学会做</text><circle cx="280" cy="410" r="85" class="b"/><circle cx="250" cy="385" r="16" fill="white"/><circle cx="310" cy="385" r="16" fill="white"/><rect x="440" y="310" width="260" height="210" rx="30" class="blue"/><text x="570" y="385" text-anchor="middle" class="t">Skill</text><text x="570" y="435" text-anchor="middle" class="s">领域步骤</text><text x="570" y="475" text-anchor="middle" class="s">判断原则</text><path d="M370 410 L430 410" class="l" stroke="#1677ff"/><text x="400" y="650" text-anchor="middle" class="s">同一权限、同一工具集</text><text x="400" y="695" text-anchor="middle" class="s">只是补充知识和工作方法</text><text x="1200" y="170" text-anchor="middle" class="t">Handoff：交给另一个 Agent</text><circle cx="980" cy="410" r="85" class="b"/><circle cx="950" cy="385" r="16" fill="white"/><circle cx="1010" cy="385" r="16" fill="white"/><circle cx="1420" cy="410" r="85" class="b"/><circle cx="1390" cy="385" r="16" fill="white"/><circle cx="1450" cy="385" r="16" fill="white"/><rect x="1110" y="335" width="180" height="150" rx="30" class="orange"/><text x="1200" y="400" text-anchor="middle" class="s">任务包</text><text x="1200" y="445" text-anchor="middle" class="s">权限边界</text><path d="M1070 410 L1100 410 M1300 410 L1325 410" class="l" stroke="#f06a20"/><text x="1200" y="650" text-anchor="middle" class="s">不同身份、权限、工具或独立上下文</text><text x="1200" y="695" text-anchor="middle" class="s">转交后由接手者承担后续执行</text></svg>
